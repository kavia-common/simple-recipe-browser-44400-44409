<div class="page-container">
  <app-search-bar (searchQuery)="onSearch($event)"></app-search-bar>

  <div class="recipe-grid" *ngIf="filteredRecipes$ | async as recipes">
    <a [routerLink]="['/recipe', recipe.id]" class="recipe-card" *ngFor="let recipe of recipes">
      <img [src]="recipe.imageUrl" [alt]="recipe.title" class="recipe-image">
      <div class="recipe-info">
        <h3 class="recipe-title">{{ recipe.title }}</h3>
        <p class="recipe-description">{{ recipe.description }}</p>
        <div class="recipe-time">
          <span>{{ recipe.cookTime }} min</span>
        </div>
      </div>
    </a>
    <div *ngIf="recipes.length === 0" class="no-results">
      <p>No recipes found. Try a different search!</p>
    </div>
  </div>
</div>
